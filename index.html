<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Progress Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1 class="logo">💪 Gym Tracker</h1>
            <div class="nav-links">
                <button class="nav-btn active" onclick="switchTab('planner')">Plan Schedule</button>
                <button class="nav-btn" onclick="switchTab('dashboard')">Dashboard</button>
            </div>
        </nav>

        <!-- Planner Tab -->
        <div id="planner" class="tab-content active">
            <div class="planner-container">
                <h2>Weekly Schedule Planner</h2>
                
                <div class="day-selector">
                    <button class="day-btn" onclick="selectDay(1)">Day 1</button>
                    <button class="day-btn" onclick="selectDay(2)">Day 2</button>
                    <button class="day-btn" onclick="selectDay(3)">Day 3</button>
                    <button class="day-btn" onclick="selectDay(4)">Day 4</button>
                    <button class="day-btn" onclick="selectDay(5)">Day 5</button>
                    <button class="day-btn" onclick="selectDay(6)">Day 6</button>
                    <button class="day-btn" onclick="selectDay(7)">Day 7</button>
                </div>

                <div class="plan-section">
                    <h3>Plan for <span id="selectedDayName">Day 1</span></h3>
                    
                    <div class="exercise-input-group">
                        <label for="exerciseName">Exercise Name:</label>
                        <input type="text" id="exerciseName" placeholder="e.g., Dumbbell Press" onkeypress="if(event.key==='Enter') addExerciseToDay()">
                        <button class="btn-primary" onclick="addExerciseToDay()">Add Exercise</button>
                    </div>

                    <div class="exercises-list" id="exercisesList">
                        <!-- Exercises will be displayed here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content">
            <div class="dashboard-container">
                <h2>Track Your Progress</h2>
                
                <div class="dashboard-layout">
                    <!-- Left Panel: Exercises and Logging -->
                    <div class="left-panel">
                        <h3>Today's Exercises</h3>
                            <div class="date-selector">
                                <label for="sessionDate">Session Date:</label>
                                <input type="date" id="sessionDate">
                            </div>

                            <div class="date-selector">
                                <label for="sessionDay">Session Day Number (1-7):</label>
                                <input type="number" id="sessionDay" min="1" max="7" value="1">
                            </div>
                            <div class="date-selector">
                                <label for="sessionNumber">Session Number:</label>
                                <input type="number" id="sessionNumber" min="1" value="1">
                            </div>

                        <div class="exercises-today" id="exercisesToday">
                            <!-- Exercises will be listed here -->
                        </div>

                        <div id="logForm" class="log-form" style="display: none;">
                            <h4>Log Exercise Details</h4>

                            <div id="setsLogContainer">
                                <!-- dynamic set rows go here -->
                            </div>

                            <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
                                <button id="addSetLogBtn" class="btn-secondary">Add Set</button>
                                <div id="totalRepsDisplay">Total reps: 0</div>
                            </div>

                            <label for="sessionName">Session name (optional):</label>
                            <input type="text" id="sessionName" placeholder="e.g. Heavy Bench, Volume" onkeypress="if(event.key==='Enter') logExercise()" />

                            <label for="overallWeight">Overall weight (kg):</label>
                            <input type="number" id="overallWeight" placeholder="Optional weight for this session" min="0.1" step="0.1" onkeypress="if(event.key==='Enter') logExercise()">

                            <button class="btn-primary" id="saveLogBtn">Log This Session</button>
                            <div id="logMessage" style="margin-top:10px;color:#333;font-weight:600"></div>
                        </div>
                    </div>

                    <!-- Right Panel: Progress Charts -->
                    <div class="right-panel">
                        <div class="chart-section">
                            <h3>Progress Graphs</h3>
                            
                            <div class="exercise-selector">
                                <label for="exerciseSelect">Select Exercise:</label>
                                <select id="exerciseSelect" onchange="updateCharts()">
                                    <option value="">Choose an exercise</option>
                                </select>
                            </div>

                            <div class="charts-grid">
                                <div class="chart-container">
                                    <h4>Reps Progress</h4>
                                    <canvas id="repsChart"></canvas>
                                </div>
                                <div class="chart-container">
                                    <h4>Weight Progress</h4>
                                    <canvas id="weightChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDKs - Compat version for global access -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
