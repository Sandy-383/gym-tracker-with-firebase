# Builds the debug APK on every push that touches the Android side.
#
# Two jobs in one:
#
#   1. It proves the Capacitor project still assembles. android/ has no copy of
#      the web app in it — cap sync generates that, plus capacitor.config.json,
#      capacitor.plugins.json and res/xml/config.xml, all of which are
#      gitignored. So "the files are committed" is not the same as "it builds",
#      and only running the real chain tells you.
#
#   2. It gives you an installable APK without needing a JDK or the Android SDK
#      on your own machine. Actions tab -> latest run -> Artifacts.
#
# The cable install (npm run android:install, see ANDROID_SETUP.md) runs this
# exact same chain locally.

name: Build debug APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "vendor/**"
      - "scripts/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "firebase-config.js"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

# Deliberately not the "pages" group used by static.yml — an APK build must
# never queue behind, or cancel, a site deploy.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Gradle 8.14.3 against compileSdk 36 needs JDK 21. 17 is too old and 24
      # is not supported by this Gradle line.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Populates www/ (Capacitor's webDir) then generates the native glue and
      # copies www/ into android/app/src/main/assets/public.
      - name: Sync web assets into the Android project
        run: npm run cap:sync

      # Catches the failure mode that matters most: the APK builds, installs,
      # opens, and then cannot start Firebase because a script 404s inside the
      # WebView. These are bundled, so they must be present after the sync.
      - name: Verify bundled libraries made it into the APK assets
        run: |
          public="android/app/src/main/assets/public"
          missing=0
          for f in \
            "index.html" "script.js" "styles.css" "firebase-config.js" \
            "vendor/chart.umd.js" \
            "vendor/firebase-app-compat.js" \
            "vendor/firebase-auth-compat.js" \
            "vendor/firebase-database-compat.js"
          do
            if [ -f "$public/$f" ]; then
              echo "  ok      $f"
            else
              echo "  MISSING $f"
              missing=1
            fi
          done
          if grep -qE 'src="https?://' "$public/index.html"; then
            echo "index.html still loads a script over the network:"
            grep -nE 'src="https?://' "$public/index.html"
            missing=1
          fi
          exit $missing

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Report APK size
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
