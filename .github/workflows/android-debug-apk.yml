# Builds the debug APK on every push that touches the Android side.
#
# Two jobs in one:
#
#   1. It proves the Capacitor project still assembles. android/ has no copy of
#      the web app in it — cap sync generates that, plus capacitor.config.json,
#      capacitor.plugins.json and res/xml/config.xml, all of which are
#      gitignored. So "the files are committed" is not the same as "it builds",
#      and only running the real chain tells you.
#
#   2. It gives you an installable APK without needing a JDK or the Android SDK
#      on your own machine. Actions tab -> latest run -> Artifacts.
#
# The cable install (npm run android:install, see ANDROID_SETUP.md) runs this
# exact same chain locally.

name: Build debug APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "vendor/**"
      - "scripts/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "script.js"
      - "styles.css"
      - "firebase-config.js"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

# Deliberately not the "pages" group used by static.yml — an APK build must
# never queue behind, or cancel, a site deploy.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# contents: write is needed only to publish the APK to the "latest" release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 22 is the floor, not a preference: @capacitor/cli 8.5 declares
      # engines.node >= 22.0.0 and cap sync fails outright on 20. Pinned to the
      # minimum rather than to whatever is current, so this job fails here if
      # the app ever stops working on the oldest Node it claims to support.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Gradle 8.14.3 against compileSdk 36 needs JDK 21. 17 is too old and 24
      # is not supported by this Gradle line.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Populates www/ (Capacitor's webDir) then generates the native glue and
      # copies www/ into android/app/src/main/assets/public.
      - name: Sync web assets into the Android project
        run: npm run cap:sync

      # Catches the failure mode that matters most: the APK builds, installs,
      # opens, and then cannot start Firebase because a script 404s inside the
      # WebView. These are bundled, so they must be present after the sync.
      - name: Verify bundled libraries made it into the APK assets
        run: |
          public="android/app/src/main/assets/public"
          missing=0
          for f in \
            "index.html" "script.js" "styles.css" "firebase-config.js" \
            "vendor/chart.umd.js" \
            "vendor/firebase-app-compat.js" \
            "vendor/firebase-auth-compat.js" \
            "vendor/firebase-database-compat.js"
          do
            if [ -f "$public/$f" ]; then
              echo "  ok      $f"
            else
              echo "  MISSING $f"
              missing=1
            fi
          done
          if grep -qE 'src="https?://' "$public/index.html"; then
            echo "index.html still loads a script over the network:"
            grep -nE 'src="https?://' "$public/index.html"
            missing=1
          fi
          exit $missing

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Report APK size
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The artifact above is only reachable by someone signed in to GitHub, and
      # it arrives as a zip — both of which make it painful to install from a
      # phone. A release asset is a plain, publicly downloadable .apk, so the
      # phone can fetch it directly in one tap and no account is involved.
      #
      # One rolling "latest" tag rather than a tag per build, deliberately: the
      # download URL then never changes, which is what makes it shareable and
      # what lets gymTracker/appVersion.apkUrl point somewhere permanent.
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gym-tracker.apk
          notes="Debug build of \`${GITHUB_SHA:0:7}\` — install straight onto a phone.

          Download **gym-tracker.apk** below, open it, and allow \"install unknown apps\"
          for whichever app opened it. No USB cable or developer options needed.

          Debug-signed, so Android will refuse to install it over a copy signed with a
          different key — uninstall the old one first if it complains about signatures.

          See ANDROID_SETUP.md for the cable-install route instead."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest gym-tracker.apk --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest gym-tracker.apk \
              --title "Latest APK" \
              --notes "$notes" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          echo "Direct link: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/gym-tracker.apk"
